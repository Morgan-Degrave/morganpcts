<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chantilly — morganpcts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="logo">morganpcts</a>
      <nav class="nav-main">
        <a href="index.html">Home</a>
        <a href="works.html" class="is-active">Works</a>
        <a href="about.html">About</a>
        <a
          href="https://www.instagram.com/morgan_pcts/?hl=fr"

        <button type="button" class="gallery__arrow" data-prev aria-label="Photo précédente">&lsaquo;</button>

          <img src="" alt="" />

        <button type="button" class="gallery__arrow" data-next aria-label="Photo suivante">&rsaquo;</button>

    <nav class="project-nav">
